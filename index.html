<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Zamfara Life 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:system-ui,-apple-system,sans-serif;color:white;touch-action:none}#renderCanvas{width:100%;height:100%;display:block}#hud{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none}.box{background:#071014dc;border:1px solid #fff2;border-radius:13px;padding:8px 10px;font-size:12px;font-weight:800;backdrop-filter:blur(8px)}#mission{position:fixed;top:58px;left:50%;transform:translateX(-50%);max-width:90vw;text-align:center;background:#071014d9;border-radius:12px;padding:8px 12px;font-size:12px;border:1px solid #fff2}#joy{position:fixed;left:12px;bottom:15px;width:155px;height:155px}.b{position:absolute;width:52px;height:52px;border:1px solid #fff3;border-radius:16px;background:#071014cc;color:#fff;font-weight:900;font-size:23px}.u{left:51px}.d{left:51px;bottom:0}.l{top:51px}.r{top:51px;right:0}#actions{position:fixed;right:10px;bottom:15px;display:grid;grid-template-columns:72px 72px;gap:7px}.a{height:50px;border-radius:14px;border:1px solid #fff3;background:#071014dd;color:#fff;font-weight:900}.p{background:#dda82e;color:#171208}#toast{position:fixed;bottom:145px;left:50%;transform:translateX(-50%);background:#101a1ddd;padding:9px 13px;border-radius:12px;opacity:0;transition:.2s;font-weight:800}#panel{display:none;position:fixed;inset:0;background:#000b;align-items:flex-end}.sheet{width:min(680px,100%);max-height:82vh;overflow:auto;background:#111b1f;border-radius:22px 22px 0 0;padding:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #fff1}.row button{background:#dda82e;border:0;border-radius:9px;padding:9px 12px;font-weight:900}.close{float:right;background:#fff1!important;color:#fff!important}h2{margin-top:0}.tag{font-size:11px;color:#a8b8ba}
</style></head>
<body><canvas id="renderCanvas"></canvas><div id="hud"><div class="box">💰 <span id="cash"></span>　⛽ <span id="fuel"></span>　⭐ <span id="rep"></span></div><div class="box" id="clock"></div></div><div id="mission"></div>
<div id="joy"><button class="b u" id="up">▲</button><button class="b d" id="down">▼</button><button class="b l" id="left">◀</button><button class="b r" id="right">▶</button></div>
<div id="actions"><button class="a p" id="drive">DRIVE</button><button class="a" id="act">ACTION</button><button class="a" onclick="panel('cars')">CARS</button><button class="a" onclick="panel('work')">WORK</button><button class="a" onclick="panel('phone')">PHONE</button><button class="a" onclick="save();toast('Saved')">SAVE</button></div><div id="toast"></div><div id="panel"><div class="sheet"><button class="row close" onclick="closePanel()">✕</button><div id="content"></div></div></div>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
const canvas=document.getElementById('renderCanvas'),engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:false,stencil:true});
engine.setHardwareScalingLevel(Math.min(1.5,Math.max(1,devicePixelRatio/1.5)));
const scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color4(.48,.62,.42,1);
const camera=new BABYLON.FollowCamera('camera',new BABYLON.Vector3(0,8,-12),scene);camera.radius=11;camera.heightOffset=5;camera.rotationOffset=180;camera.cameraAcceleration=.08;camera.maxCameraSpeed=25;
const sun=new BABYLON.HemisphericLight('sun',new BABYLON.Vector3(0,1,0),scene);sun.intensity=.9;const dir=new BABYLON.DirectionalLight('dir',new BABYLON.Vector3(-.5,-1,.5),scene);dir.intensity=1.1;
const groundMat=new BABYLON.StandardMaterial('ground',scene);groundMat.diffuseColor=new BABYLON.Color3(.38,.52,.29);
const roadMat=new BABYLON.StandardMaterial('road',scene);roadMat.diffuseColor=new BABYLON.Color3(.12,.14,.14);
const sandMat=new BABYLON.StandardMaterial('sand',scene);sandMat.diffuseColor=new BABYLON.Color3(.62,.52,.34);
function box(name,x,y,z,w,h,d,mat){let m=BABYLON.MeshBuilder.CreateBox(name,{width:w,height:h,depth:d},scene);m.position.set(x,y,z);m.material=mat;return m}
let ground=BABYLON.MeshBuilder.CreateGround('Gusau',{width:220,height:170},scene);ground.material=groundMat;
const roadData=[[-45,0,10,170],[0,0,10,170],[45,0,10,170],[-75,25,220,10],[0,-20,220,10],[75,55,220,10]];
for(const r of roadData){let m=box('road',r[0],.02,r[1],r[2],.04,r[3],roadMat);for(let q=-100;q<110;q+=8){if(r[2]>r[3])box('line',r[0],.04,q, .25,.03,4,sandMat);else box('line',q,.04,r[1],4,.03,.25,sandMat)}}
const placeDefs=[['Gusau Market',-58,25,'market'],['Central Bank',8,18,'bank'],['Hospital',55,18,'hospital'],['Fuel Station',72,48,'fuel'],['Magaji Motors',-37,-9,'dealer'],['Police HQ',4,-21,'police'],['Job Centre',38,-21,'job'],['City Park',72,-18,'park'],['House',84,9,'house'],['Garage',64,-4,'garage'],['Business Plaza',-8,57,'business'],['School',-50,-28,'school'],['Emir Palace',72,-48,'palace']];
const labels=[];const buildingMat=new BABYLON.StandardMaterial('building',scene);buildingMat.diffuseColor=new BABYLON.Color3(.67,.53,.37);
const roofMat=new BABYLON.StandardMaterial('roof',scene);roofMat.diffuseColor=new BABYLON.Color3(.25,.19,.15);
for(let i=0;i<115;i++){let x=(i%11-5)*18+(i%3)*2,z=(Math.floor(i/11)-5)*17+(i%4);if(Math.abs(x)<7||Math.abs(z-25)<7||Math.abs(z+20)<7||Math.abs(x-45)<7)continue;let h=3+((i*7)%5);box('building',x,h/2,z,12,h,9,buildingMat);box('roof',x,h+.15,z,12,.35,9,roofMat)}
for(const p of placeDefs){let b=box(p[0],p[1],3,p[2],14,6,10,buildingMat);let tag=document.createElement('div');tag.textContent=p[0];labels.push({p,mesh:b});}
function mat(n,c){let m=new BABYLON.StandardMaterial(n,scene);m.diffuseColor=BABYLON.Color3.FromHexString(c);return m}
const carMats={corolla:mat('corolla','#eeeeee'),accord:mat('accord','#36577d'),hilux:mat('hilux','#80522f'),benz:mat('benz','#22272d'),traffic1:mat('traffic1','#b9473e'),traffic2:mat('traffic2','#d5b43f'),traffic3:mat('traffic3','#4778a4')};
const cars={corolla:{n:'Toyota Corolla',price:0,sp:16,turn:2.1,m:carMats.corolla},accord:{n:'Honda Accord',price:6000000,sp:18,turn:2.0,m:carMats.accord},hilux:{n:'Toyota Hilux',price:12000000,sp:15,turn:1.7,m:carMats.hilux},benz:{n:'Mercedes-Benz C-Class',price:18500000,sp:20,turn:2.15,m:carMats.benz}};
function makeCar(name,material){let root=new BABYLON.TransformNode(name,scene);let body=box(name+'body',0,.65,0,3.2,1.0,5.2,material);body.parent=root;let glass=box(name+'glass',0,1.18,-.1,2.2,.35,2.1,mat(name+'glass','#6e8990'));glass.parent=root;for(const sx of[-1.55,1.55])for(const sz of[-1.75,1.75]){let w=BABYLON.MeshBuilder.CreateCylinder(name+'wheel',{diameter:.85,height:.28,tessellation:12},scene);w.rotation.z=Math.PI/2;w.position.set(sx,.42,sz);w.parent=root;w.material=mat(name+'wheel'+sx+sz,'#17191a')}return root}
const playerCar=makeCar('playerCar',carMats.corolla);playerCar.position.set(0,.1,0);camera.lockedTarget=playerCar;
let S=JSON.parse(localStorage.getItem('zl3d')||'null')||{cash:500000,fuel:100,rep:0,day:1,hour:8,min:0,job:'',cars:['corolla'],car:'corolla',mission:0,wanted:0,business:0};
let driving=false,steer=0,throttle=0,speed=0;
function save(){localStorage.setItem('zl3d',JSON.stringify(S))}
function money(n){return'₦'+Math.round(n).toLocaleString('en-NG')}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.opacity=1;clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.opacity=0,1600)}
const input={};function bind(id,k){let e=document.getElementById(id);e.onpointerdown=a=>{a.preventDefault();input[k]=1};e.onpointerup=e.onpointercancel=e.onpointerleave=a=>{input[k]=0}}bind('up','up');bind('down','down');bind('left','left');bind('right','right');
addEventListener('keydown',e=>{let k={w:'up',ArrowUp:'up',s:'down',ArrowDown:'down',a:'left',ArrowLeft:'left',d:'right',ArrowRight:'right'}[e.key];if(k)input[k]=1;if(e.key==='Enter')action()});addEventListener('keyup',e=>{let k={w:'up',ArrowUp:'up',s:'down',ArrowDown:'down',a:'left',ArrowLeft:'left',d:'right',ArrowRight:'right'}[e.key];if(k)input[k]=0});
function action(){if(driving){driving=false;speed=0;playerCar.position.y=.1;toast('Parked / exited vehicle');return}driving=true;toast('Driving '+cars[S.car].n)}
document.getElementById('drive').onclick=action;document.getElementById('act').onclick=()=>toast('Explore the city and reach the highlighted mission location');
function update(dt){if(driving){let C=cars[S.car];let t=(input.up?1:0)-(input.down?1:0);let s=input.right?1:input.left?-1:0;speed+=t*10*dt;speed*=Math.pow(.985,dt*60);speed=Math.max(-5,Math.min(C.sp,speed));playerCar.rotation.y+=s*C.turn*dt*(.3+Math.abs(speed)/C.sp);let nx=playerCar.position.x+Math.sin(playerCar.rotation.y)*speed*dt,nz=playerCar.position.z+Math.cos(playerCar.rotation.y)*speed*dt;if(Math.abs(nx)<108&&Math.abs(nz)<83){playerCar.position.x=nx;playerCar.position.z=nz}else speed*=-.2;S.fuel=Math.max(0,S.fuel-Math.abs(speed)*dt*.12)}
S.min+=dt*2;if(S.min>=60){S.min-=60;S.hour++;if(S.hour>=24){S.hour=0;S.day++;let pay={driver:35000,shop:45000,it:70000,mechanic:90000}[S.job]||0;S.cash+=pay+S.business*25000;if(pay+S.business*25000)toast('Daily income '+money(pay+S.business*25000))}}}
function panel(k){let h='';if(k==='cars')h='<h2>🚘 Magaji Motors</h2>'+Object.entries(cars).map(([id,v])=>'<div class="row"><div><b>'+v.n+'</b><div class="tag">Top speed '+v.sp+' • 3D model</div></div><button onclick="buy(\''+id+'\')">'+(S.cars.includes(id)?(S.car===id?'Selected':'Select'):money(v.price))+'</button></div>').join('');if(k==='work')h='<h2>💼 Work</h2>'+[['driver','Driver','₦35,000'],['shop','Shop Assistant','₦45,000'],['it','IT Support','₦70,000'],['mechanic','Mechanic','₦90,000']].map(a=>'<div class="row"><div><b>'+a[1]+'</b><div class="tag">'+a[2]+' daily</div></div><button onclick="job(\''+a[0]+'\')">Choose</button></div>').join('');if(k==='phone')h='<h2>📱 Phone</h2><div class="row"><b>Mission</b><span>'+(S.mission+1)+'/6</span></div><div class="row"><b>Cash</b><span>'+money(S.cash)+'</span></div><div class="row"><b>Reputation</b><span>'+S.rep+'</span></div><div class="row"><b>Fuel</b><span>'+Math.round(S.fuel)+'%</span></div>';document.getElementById('content').innerHTML=h;document.getElementById('panel').style.display='flex'}function closePanel(){document.getElementById('panel').style.display='none'}function buy(id){if(S.cars.includes(id)){S.car=id;playerCar.material=cars[id].m;toast(cars[id].n+' selected');closePanel();return}if(S.cash>=cars[id].price){S.cash-=cars[id].price;S.cars.push(id);S.car=id;playerCar.getChildMeshes().find(m=>m.name.includes('body')).material=cars[id].m;toast('Purchased '+cars[id].n);closePanel()}else toast('Not enough cash')}function job(j){S.job=j;S.rep+=2;toast('Job selected');closePanel()}
function missions(){let a=['Visit Magaji Motors and test the new 3D city.','Drive to Gusau Market.','Drive to Central Bank.','Visit Police HQ.','Refuel at Fuel Station.','Buy a premium vehicle.'];document.getElementById('mission').textContent=a[Math.min(S.mission,5)];let pos=playerCar.position;let target=placeDefs[S.mission===0?4:S.mission===1?0:S.mission===2?1:S.mission===3?5:S.mission===4?3:4];if(target&&Math.hypot(pos.x-target[1],pos.z-target[2])<7){S.mission++;S.rep+=10;S.cash+=25000;toast('Mission complete +₦25,000')}}
engine.runRenderLoop(()=>{let dt=Math.min(.04,engine.getDeltaTime()/1000);update(dt);missions();document.getElementById('cash').textContent=money(S.cash);document.getElementById('fuel').textContent=Math.round(S.fuel)+'%';document.getElementById('rep').textContent=S.rep;document.getElementById('clock').textContent='Day '+S.day+' • '+String(S.hour).padStart(2,'0')+':'+String(Math.floor(S.min)).padStart(2,'0');scene.render()});
addEventListener('resize',()=>engine.resize());toast('Welcome to 3D Gusau — ₦500,000');
</script></body></html>
