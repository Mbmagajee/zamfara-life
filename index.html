<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Zamfara Life</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#718c5b;color:#fff;font-family:system-ui,sans-serif;touch-action:none}#g{width:100%;height:100%;display:block}#hud{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none}.box{background:#081014dd;border:1px solid #fff2;border-radius:13px;padding:8px 10px;backdrop-filter:blur(6px);font-size:12px;font-weight:800}#mission{position:fixed;top:62px;left:50%;transform:translateX(-50%);background:#081014dd;border:1px solid #fff2;border-radius:12px;padding:8px 12px;font-size:12px;text-align:center;max-width:90vw}#joy{position:fixed;left:12px;bottom:18px;width:150px;height:150px}.b{position:absolute;width:50px;height:50px;border-radius:15px;border:1px solid #fff2;background:#071014cc;color:#fff;font-weight:900;font-size:22px}.u{left:50px}.d{left:50px;bottom:0}.l{top:50px}.r{top:50px;right:0}#acts{position:fixed;right:12px;bottom:18px;display:grid;grid-template-columns:70px 70px;gap:7px}.a{height:50px;border:1px solid #fff2;border-radius:14px;background:#071014dd;color:#fff;font-weight:900}.p{background:#dba62e;color:#171208}#toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:#10191ddd;padding:9px 13px;border-radius:12px;opacity:0;transition:.2s;font-weight:800}#panel{display:none;position:fixed;inset:0;background:#050b0dcc;align-items:flex-end}.sheet{width:min(680px,100%);max-height:82vh;overflow:auto;background:#121c20;border-radius:22px 22px 0 0;padding:18px}.row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #fff1;padding:12px 0;gap:10px}.row button{background:#dca72e;border:0;border-radius:9px;padding:9px 12px;font-weight:900}.close{float:right;background:#fff1!important;color:#fff!important}.tag{font-size:11px;color:#9eb2b5}h2{margin-top:0}#map{position:fixed;right:10px;bottom:10px;width:120px;height:92px;border:1px solid #fff3;border-radius:11px;background:#081014cc}
</style></head><body><canvas id="g"></canvas><div id="hud"><div class="box">💰 <span id="cash"></span>　⚡ <span id="en"></span>　⛽ <span id="fuel"></span>　⭐ <span id="rep"></span></div><div class="box" id="time"></div></div><div id="mission"></div><canvas id="map" width="240" height="184"></canvas><div id="joy"><button class="b u" id="up">▲</button><button class="b d" id="dn">▼</button><button class="b l" id="lf">◀</button><button class="b r" id="rt">▶</button></div><div id="acts"><button class="a p" id="drive">DRIVE</button><button class="a" id="action">ACTION</button><button class="a" onclick="panel('cars')">CARS</button><button class="a" onclick="panel('work')">WORK</button><button class="a" onclick="panel('phone')">PHONE</button><button class="a" onclick="save();toast('Saved')">SAVE</button></div><div id="toast"></div><div id="panel"><div class="sheet"><button class="row close" onclick="closePanel()">✕</button><div id="content"></div></div></div>
<script>
const c=document.getElementById('g'),x=c.getContext('2d'),m=document.getElementById('map'),q=m.getContext('2d');let W,H,scale=Math.min(devicePixelRatio||1,2);function rs(){W=innerWidth;H=innerHeight;c.width=W*scale;c.height=H*scale;x.setTransform(scale,0,0,scale,0,0)}addEventListener('resize',rs);rs();
const world={w:4200,h:3000},roads=[{x:250,y:0,w:210,h:3000},{x:1050,y:0,w:230,h:3000},{x:2050,y:0,w:240,h:3000},{x:3000,y:0,w:230,h:3000},{x:0,y:520,w:4200,h:220},{x:0,y:1320,w:4200,h:240},{x:0,y:2220,w:4200,h:220},{x:640,y:0,w:150,h:3000},{x:2650,y:0,w:140,h:3000}];
const places=[['Gusau Market',440,380,'market'],['Central Bank',1370,360,'bank'],['General Hospital',2420,420,'hospital'],['Fuel Station',3150,410,'fuel'],['Magaji Motors',760,980,'dealer'],['Police HQ',1320,1510,'police'],['Job Centre',2310,1500,'job'],['City Park',3350,1510,'park'],['House',3650,840,'house'],['Garage',2900,940,'garage'],['Taxi Stand',560,2370,'taxi'],['Business Plaza',1600,2380,'business'],['School',700,1780,'school'],['Emir Palace',3450,2050,'palace']];
let buildings=[];for(let xx=20;xx<4100;xx+=330)for(let yy=40;yy<2900;yy+=300)if(!roads.some(r=>xx+250>r.x&&xx<r.x+r.w&&yy+200>r.y&&yy<r.y+r.h))buildings.push({x:xx,y:yy,w:240+(xx+yy)%35,h:180+(xx*3+yy)%40});
places.forEach(p=>buildings.push({x:p[1]-80,y:p[2]-55,w:160,h:110}));
let S=JSON.parse(localStorage.getItem('zamfaraLife')||'null')||{cash:500000,energy:100,fuel:100,rep:0,day:1,hour:8,min:0,job:'',cars:['corolla'],car:'corolla',mission:0,wanted:0,business:0,x:2130,y:1660,bank:0};
const cars={corolla:{n:'Toyota Corolla',price:0,sp:250,acc:420,turn:2.8,col:'#eee'},accord:{n:'Honda Accord',price:6000000,sp:285,acc:470,turn:2.7,col:'#38577e'},hilux:{n:'Toyota Hilux',price:12000000,sp:250,acc:410,turn:2.3,col:'#8a5a34'},benz:{n:'Mercedes-Benz C-Class',price:18500000,sp:315,acc:510,turn:2.8,col:'#25292e'}};
let P={x:S.x,y:S.y,a:0,car:false,v:0},cam={x:0,y:0},traffic=[],people=[],inp={};function seed(){for(let i=0;i<24;i++){let hor=i%2===0,r=hor?roads[4+i%3]:roads[i%4];traffic.push({x:hor?Math.random()*world.w:r.x+r.w/2+(i%2?30:-30),y:hor?r.y+r.h/2+(i%2?30:-30):Math.random()*world.h,a:hor?(i%4<2?0:Math.PI):(i%4<2?Math.PI/2:-Math.PI/2),v:55+Math.random()*70,col:['#c74b3f','#e0bd45','#4a7db2','#eee','#43865f'][i%5]})}for(let i=0;i<45;i++)people.push({x:100+Math.random()*4000,y:80+Math.random()*2800,a:Math.random()*6.28,v:15+Math.random()*20})}seed();
function money(n){return'₦'+Math.max(0,Math.round(n)).toLocaleString('en-NG')}function save(){S.x=P.x;S.y=P.y;localStorage.setItem('zamfaraLife',JSON.stringify(S))}function toast(t){let z=document.getElementById('toast');z.textContent=t;z.style.opacity=1;clearTimeout(window.tt);window.tt=setTimeout(()=>z.style.opacity=0,1600)}
function blocked(a,b,r=15){return a<15||b<15||a>world.w-15||b>world.h-15||buildings.some(o=>a+r>o.x&&a-r<o.x+o.w&&b+r>o.y&&b-r<o.y+o.h)}
function near(){let b=null,d=1e9;for(let p of places){let z=Math.hypot(P.x-p[1],P.y-p[2]);if(z<d){d=z;b=p}}return[b,d]}function carNear(){let b=null,d=70;for(let v of traffic){let z=Math.hypot(P.x-v.x,P.y-v.y);if(z<d){d=z;b=v}}return[b,d]}
function key(k){return!!inp[k]}function move(dt){let ix=(key('r')?1:0)-(key('l')?1:0),iy=(key('d')?1:0)-(key('u')?1:0);if(P.car){let C=cars[S.car];if(iy)P.v+=iy*C.acc*dt;else P.v*=Math.pow(.82,dt*4);P.v=Math.max(-C.sp*.45,Math.min(C.sp,P.v));if(ix)P.a+=ix*C.turn*dt*(.2+Math.abs(P.v)/C.sp);let nx=P.x+Math.cos(P.a)*P.v*dt,ny=P.y+Math.sin(P.a)*P.v*dt;if(!blocked(nx,ny,28)){P.x=nx;P.y=ny}else{P.v*=-.2;S.wanted=Math.min(5,S.wanted+.2);toast('Crash! Police alerted')}S.fuel=Math.max(0,S.fuel-Math.abs(P.v)*dt*.0009)}else{let l=Math.hypot(ix,iy)||1,nx=P.x+ix/l*145*dt,ny=P.y+iy/l*145*dt;if(!blocked(nx,ny)){P.x=nx;P.y=ny}if(ix||iy)S.energy=Math.max(0,S.energy-dt)}}
function update(dt){for(let v of traffic){v.x+=Math.cos(v.a)*v.v*dt;v.y+=Math.sin(v.a)*v.v*dt;if(v.x<-50)v.x=world.w+50;if(v.x>world.w+50)v.x=-50;if(v.y<-50)v.y=world.h+50;if(v.y>world.h+50)v.y=-50}for(let n of people){n.x+=Math.cos(n.a)*n.v*dt;n.y+=Math.sin(n.a)*n.v*dt;if(Math.random()<.01)n.a+=(Math.random()-.5)*2;if(n.x<20||n.x>world.w-20||n.y<20||n.y>world.h-20)n.a+=Math.PI}S.min+=dt*2.3;if(S.min>60){S.min-=60;S.hour++;if(S.hour>23){S.hour=0;S.day++;let pay={driver:35000,shop:45000,it:70000,mechanic:90000}[S.job]||0;let biz=S.business*25000;S.cash+=pay+biz;if(pay+biz)toast('Daily income '+money(pay+biz))}}if(S.wanted)S.wanted=Math.max(0,S.wanted-dt*.012)}
function mission(){let t=['Drive to Magaji Motors.','Deliver to Gusau Market.','Reach Central Bank.','Clear your record at Police HQ.','Refuel at Fuel Station.','Buy a premium car.','Reach ₦10,000,000.'][Math.min(S.mission,6)];document.getElementById('mission').textContent=t;let [p,d]=near();if(!p)return;if(S.mission===0&&p[3]==='dealer'&&d<140){S.mission++;S.rep+=5;toast('Mission complete +5 rep')}else if(S.mission===1&&p[3]==='market'&&d<140){S.mission++;S.rep+=10;S.cash+=50000;toast('Delivery +₦50,000')}else if(S.mission===2&&p[3]==='bank'&&d<140){S.mission++;S.rep+=10;S.cash+=65000;toast('Passenger job +₦65,000')}else if(S.mission===3&&p[3]==='police'&&d<140){S.mission++;S.wanted=0;toast('Record cleared')}else if(S.mission===4&&p[3]==='fuel'&&d<140){S.mission++;S.rep+=15;toast('Fuel mission complete')}else if(S.mission===5&&S.cars.length>1){S.mission++;S.rep+=25;toast('Premium car mission complete')}else if(S.mission===6&&S.cash>=10000000){S.mission++;toast('You built a Gusau empire!')}}
function act(){let[p,d]=near();if(p&&d<145){let t=p[3];if(t==='fuel'){let cost=Math.ceil((100-S.fuel)*650);if(S.cash>=cost){S.cash-=cost;S.fuel=100;toast('Tank full '+money(cost))}}else if(t==='bank'||t==='job'||t==='dealer'||t==='garage'||t==='business'||t==='school'||t==='market')panel(t==='dealer'||t==='garage'?'cars':t==='job'?'work':t);else if(t==='police'){S.wanted=0;toast('Police record cleared')}else if(t==='hospital'){S.energy=100;S.cash=Math.max(0,S.cash-5000);toast('Hospital visit')}else if(t==='taxi'){S.cash=Math.max(0,S.cash-2000);P.x=1370;P.y=360;toast('Taxi to Bank')}else toast(p[0])}else if(P.car){P.car=false;P.v=0;toast('Exited vehicle')}else{let[v,d2]=carNear();if(v){P.car=true;S.wanted=Math.max(0,S.wanted-.1);toast('Driving '+cars[S.car].n)}else toast('Move closer to a car')}}
function panel(k){let h='';if(k==='cars')h='<h2>🚘 Magaji Motors</h2>'+Object.entries(cars).map(([id,v])=>'<div class="row"><div><b>'+v.n+'</b><div class="tag">Speed '+v.sp+' • Handling '+v.turn+'</div></div><button onclick="buy(\''+id+'\')">'+(S.cars.includes(id)?(S.car===id?'Selected':'Select'):money(v.price))+'</button></div>').join('');if(k==='work')h='<h2>💼 Work</h2>'+[['driver','Driver','₦35,000'],['shop','Shop Assistant','₦45,000'],['it','IT Support','₦70,000'],['mechanic','Mechanic','₦90,000']].map(a=>'<div class="row"><div><b>'+a[1]+'</b><div class="tag">'+a[2]+' daily</div></div><button onclick="job(\''+a[0]+'\')">Choose</button></div>').join('');if(k==='bank')h='<h2>🏦 Bank</h2><div class="row"><b>Cash</b><span>'+money(S.cash)+'</span></div><div class="row"><b>Bank</b><span>'+money(S.bank)+'</span></div><div class="row"><button onclick="bank(100000)">Deposit 100k</button><button onclick="bank(-100000)">Withdraw 100k</button></div>';if(k==='market')h='<h2>🛒 Gusau Market</h2><div class="row"><div>Food basket<br><span class="tag">+35 energy</span></div><button onclick="food()">₦7,000</button></div><div class="row"><div>Local clothes</div><button onclick="thing()">₦20,000</button></div>';if(k==='business')h='<h2>🏢 Business Plaza</h2><div class="row"><div>Open roadside business<br><span class="tag">₦25,000 daily</span></div><button onclick="biz()">₦750,000</button></div><div class="row"><b>Owned</b><span>'+S.business+'</span></div>';if(k==='school')h='<h2>🎓 School</h2><p>Training improves reputation and career options.</p><button onclick="train()">Train for ₦30,000</button>';if(k==='phone')h='<h2>📱 Phone</h2><div class="row"><b>Mission</b><span>'+Math.min(S.mission+1,7)+'/7</span></div><div class="row"><b>Wanted</b><span>'+S.wanted.toFixed(1)+'</span></div><div class="row"><b>Vehicles</b><span>'+S.cars.length+'</span></div><div class="row"><b>Reputation</b><span>'+S.rep+'</span></div>';document.getElementById('content').innerHTML=h;document.getElementById('panel').style.display='flex'}function closePanel(){document.getElementById('panel').style.display='none'}function buy(id){let v=cars[id];if(S.cars.includes(id)){S.car=id;toast(v.n+' selected');closePanel();return}if(S.cash>=v.price){S.cash-=v.price;S.cars.push(id);S.car=id;toast('Bought '+v.n);closePanel()}else toast('Not enough cash')}function job(j){S.job=j;S.rep+=2;toast('Job selected');closePanel()}function bank(n){if(n>0&&S.cash>=n){S.cash-=n;S.bank+=n}else if(n<0&&S.bank>=-n){S.bank+=n;S.cash-=n}else return toast('Insufficient funds');toast('Bank updated')}function food(){if(S.cash>=7000){S.cash-=7000;S.energy=Math.min(100,S.energy+35);closePanel();toast('Energy restored')}else toast('Not enough cash')}function thing(){if(S.cash>=20000){S.cash-=20000;S.rep++;closePanel();toast('Market purchase complete')}}function biz(){if(S.cash>=750000){S.cash-=750000;S.business++;closePanel();toast('Business opened')}else toast('Need ₦750,000')}function train(){if(S.cash>=30000){S.cash-=30000;S.rep+=10;closePanel();toast('Training complete')}else toast('Need ₦30,000')}
function draw(){x.clearRect(0,0,W,H);let z=Math.min(1.15,Math.max(.7,Math.min(W/760,H/430)));cam.x=Math.max(0,Math.min(world.w-W/z,P.x-W/z/2));cam.y=Math.max(0,Math.min(world.h-H/z,P.y-H/z/2));x.save();x.scale(z,z);x.translate(-cam.x,-cam.y);x.fillStyle='#78935f';x.fillRect(cam.x,cam.y,W/z,H/z);x.fillStyle='#829e67';for(let a=Math.floor(cam.x/330)*330;a<cam.x+W/z+330;a+=330)for(let b=Math.floor(cam.y/300)*300;b<cam.y+H/z+300;b+=300)x.fillRect(a+3,b+3,320,290);for(let r of roads){x.fillStyle='#404746';x.fillRect(r.x,r.y,r.w,r.h);x.fillStyle='#cbb26b';if(r.w>r.h)for(let a=r.x+15;a<r.x+r.w;a+=55)x.fillRect(a,r.y+r.h/2-2,32,4);else for(let b=r.y+15;b<r.y+r.h;b+=55)x.fillRect(r.x+r.w/2-2,b,4,32)}for(let b of buildings){x.fillStyle='#d0b183';x.fillRect(b.x,b.y,b.w,b.h);x.fillStyle='#6e5139';x.fillRect(b.x+8,b.y+8,b.w-16,20);x.fillStyle='#607f85';x.fillRect(b.x+22,b.y+48,35,25);x.fillRect(b.x+b.w-57,b.y+48,35,25)}x.textAlign='center';x.font='bold 14px system-ui';for(let p of places){x.fillStyle='#121b1dcc';x.fillRect(p[1]-72,p[2]-82,144,22);x.fillStyle='#fff';x.fillText(p[0],p[1],p[2]-66)}for(let n of people){x.fillStyle='#49362d';x.beginPath();x.arc(n.x,n.y-6,6,0,7);x.fill();x.fillStyle='#28626b';x.fillRect(n.x-5,n.y,10,16)}for(let v of traffic){x.save();x.translate(v.x,v.y);x.rotate(v.a);x.fillStyle='#1118';x.fillRect(-21,-11,42,22);x.fillStyle=v.col;x.fillRect(-19,-9,38,18);x.fillStyle='#9ab7bd';x.fillRect(-8,-7,16,6);x.restore()}if(P.car){let C=cars[S.car];x.save();x.translate(P.x,P.y);x.rotate(P.a);x.fillStyle='#1118';x.fillRect(-28,-15,56,30);x.fillStyle=C.col;x.fillRect(-25,-12,50,24);x.fillStyle='#9ab8bf';x.fillRect(-9,-9,18,7);x.restore()}else{x.fillStyle='#171a1c';x.beginPath();x.arc(P.x,P.y-9,9,0,7);x.fill();x.fillStyle='#e0a43b';x.fillRect(P.x-8,P.y,16,23)}x.restore();if(S.hour<6||S.hour>19){x.fillStyle='#07122b88';x.fillRect(0,0,W,H)}if(S.wanted>0){x.fillStyle='#ff5c5c';x.font='bold 14px system-ui';x.fillText('🚔 WANTED '+('★'.repeat(Math.ceil(S.wanted))),16,H-155)}document.getElementById('cash').textContent=money(S.cash);document.getElementById('en').textContent=Math.round(S.energy);document.getElementById('fuel').textContent=Math.round(S.fuel);document.getElementById('rep').textContent=S.rep;document.getElementById('time').textContent='Day '+S.day+' • '+String(Math.floor(S.hour)).padStart(2,'0')+':'+String(Math.floor(S.min)).padStart(2,'0');q.fillStyle='#56704c';q.fillRect(0,0,240,184);q.fillStyle='#394443';for(let r of roads)q.fillRect(r.x/world.w*240,r.y/world.h*184,Math.max(4,r.w/world.w*240),Math.max(4,r.h/world.h*184));q.fillStyle='#ffd34c';q.beginPath();q.arc(P.x/world.w*240,P.y/world.h*184,4,0,7);q.fill()}
function bind(id,k){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();inp[k]=1};b.onpointerup=b.onpointercancel=b.onpointerleave=e=>{e.preventDefault();inp[k]=0}}bind('up','u');bind('dn','d');bind('lf','l');bind('rt','r');addEventListener('keydown',e=>{let k={ArrowUp:'u',w:'u',ArrowDown:'d',s:'d',ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r'}[e.key];if(k)inp[k]=1;if(e.key==='Enter')act()});addEventListener('keyup',e=>{let k={ArrowUp:'u',w:'u',ArrowDown:'d',s:'d',ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r'}[e.key];if(k)inp[k]=0});document.getElementById('drive').onclick=()=>{if(P.car){P.car=false;P.v=0;toast('Exited')}else{let[v,d]=carNear();if(v){P.car=true;toast('Driving '+cars[S.car].n)}else toast('Get near a car')}};document.getElementById('action').onclick=act;
let last=performance.now(),saveT=0;function loop(t){let dt=Math.min(.045,(t-last)/1000);last=t;move(dt);update(dt);mission();saveT+=dt;if(saveT>10){save();saveT=0}draw();requestAnimationFrame(loop)}toast('Welcome to Gusau — ₦500,000');requestAnimationFrame(loop);
</script></body></html>
